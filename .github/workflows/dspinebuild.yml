name: Build DSpine (llama.cpp fork, CUDA, Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - dspine
  pull_request:
    branches:
      - dspine

permissions:
  contents: read

jobs:
  build-windows-cuda:
    name: Windows x64 / CUDA / Release
    runs-on: windows-2022
    timeout-minutes: 240

    env:
      BUILD_DIR: build
      ARTIFACT_NAME: llama-dspine-cuda-windows
      CCACHE_DIR: ${{ github.workspace }}\.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC (Visual Studio 2022, x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'

      - name: Install ccache (Windows)
        shell: pwsh
        run: |
          choco install ccache -y
          $ccachePath = (Get-Command ccache.exe).Source | Split-Path
          echo $ccachePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-cuda-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda-ccache-

      - name: Verify toolchain
        shell: cmd
        run: |
          echo === nvcc ===
          nvcc --version
          echo === cl ===
          cl 2>&1 | findstr /C:"Microsoft (R)"
          echo === cmake ===
          cmake --version
          echo === ccache ===
          ccache --version

      - name: Configure CMake (CUDA, Release)
        shell: cmd
        run: |
          cmake -B %BUILD_DIR% -G Ninja ^
            -DGGML_CUDA=ON ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe" ^
            -DCMAKE_CUDA_ARCHITECTURES="61;75;80;86;89" ^
            -DLLAMA_CURL=OFF ^
            -DGGML_CCACHE=ON

      - name: Build
        shell: cmd
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPILERCHECK: content
        run: |
          cmake --build %BUILD_DIR% --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Stage artifacts
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Get-ChildItem -Path "$env:BUILD_DIR" -Filter "*.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination $dist -Force
          }

          Get-ChildItem -Path "$env:BUILD_DIR" -Filter "*.dll" -Recurse | ForEach-Object {
            # Исключаем файлы компилятора CMake, если они случайно попали внутрь
            if ($_.Name -notlike "CMake*CompilerId*") {
              Copy-Item $_.FullName -Destination $dist -Force
            }
          }
          
          if ($env:CUDA_PATH) {
            $patterns = @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll")
            foreach ($p in $patterns) {
              Get-ChildItem -Path "$env:CUDA_PATH\bin" -Filter $p -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName -Destination $dist -Force }
            }
          }
          
          $vcRedistDir = $env:VCToolsRedistDir
          if (-not $vcRedistDir) {
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            if ($vsPath) {
              $vcRedistDir = Get-ChildItem -Path "$vsPath\VC\Redist\MSVC" -Recurse -Filter "vcruntime140.dll" | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
            }
          }
          if ($vcRedistDir) {
            Get-ChildItem -Path $vcRedistDir -Recurse -Filter "vcruntime140*.dll" -ErrorAction SilentlyContinue | Select-Object -First 2 | ForEach-Object { Copy-Item $_.FullName -Destination $dist -Force }
            Get-ChildItem -Path $vcRedistDir -Recurse -Filter "msvcp140*.dll" -ErrorAction SilentlyContinue | Select-Object -First 2 | ForEach-Object { Copy-Item $_.FullName -Destination $dist -Force }
          }
          
          @(
            "Commit: $env:GITHUB_SHA"
            "Ref: $env:GITHUB_REF"
            "Run: $env:GITHUB_RUN_ID"
            "Date(UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))"
          ) | Set-Content -Path "$dist\BUILD_INFO.txt" -Encoding UTF8

          Compress-Archive -Path "$dist\*" -DestinationPath "$env:ARTIFACT_NAME.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-dspine-cuda-windows
          path: llama-dspine-cuda-windows.zip
          retention-days: 30
          if-no-files-found: error
